# ===== 禁止IP直接访问配置 =====
# 当请求的Host头不匹配任何配置的server_name时（如直接用IP访问），返回444关闭连接
# 注意：HTTPS配置仅在域名部署时使用，IP拦截块固定存在
server {
    listen 80 default_server;
    server_name _;

    # 返回444，直接关闭连接不响应任何内容
    # 这可以防止IP直接访问，提高安全性
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;

    # 使用自签名证书（在Docker构建时生成）
    ssl_certificate /etc/nginx/ssl/default.crt;
    ssl_certificate_key /etc/nginx/ssl/default.key;
    # Let's Encrypt 已移除 OCSP URL，显式关闭 stapling 避免无意义告警
    ssl_stapling off;
    ssl_stapling_verify off;

    # 返回444，直接关闭连接
    return 444;
}

# 定义上游服务块，解决容器启动时序问题
upstream poetize-java {
    server poetize-java:8081 max_fails=3 fail_timeout=30s;
    # 到后端的长连接复用（需配合 location 级 proxy_http_version 1.1 + proxy_set_header Connection ""）
    keepalive 64;
    keepalive_requests 10000;
    keepalive_timeout 60s;
}

# [已迁移] Python 后端已合并到 Java
# upstream poetize-python {
#     server poetize-python:5000 max_fails=3 fail_timeout=30s;
# }


# 添加map指令用于解析请求URI，提取文章ID、分类ID等
map $request_uri $article_id {
    ~^/article/([A-Za-z0-9-]+)$ $1;
    default "";
}

# 解析sort页面的参数 - 从URL路径中提取分类ID
map $uri $sort_id {
    ~^/sort/([0-9]+) $1;
    default "";
}

# 解析label参数仍然从查询参数中获取
map $args $label_id {
    ~labelId=([0-9]+) $1;
    default "";
}

# 增加IM相关的map指令
map $request_uri $is_im_page {
    ~^/im.*$ 1;
    default 0;
}

# 添加map解析 lang 参数 - 支持完整的14种语言
map $arg_lang $lang_suffix {
    default "";
    zh "";           # 中文（默认）
    en "-en";        # 英文
    ja "-ja";        # 日文
    zh-TW "-zh-TW";  # 繁体中文
    ko "-ko";        # 韩文
    fr "-fr";        # 法文
    de "-de";        # 德文
    es "-es";        # 西班牙文
    ru "-ru";        # 俄文
    pt "-pt";        # 葡萄牙文
    it "-it";        # 意大利文
    ar "-ar";        # 阿拉伯文
    th "-th";        # 泰文
    vi "-vi";        # 越南文
}

# 添加语言验证map，确保只处理支持的语言
map $arg_lang $is_supported_lang {
    default 0;
    zh 1;
    en 1;
    ja 1;
    zh-TW 1;
    ko 1;
    fr 1;
    de 1;
    es 1;
    ru 1;
    pt 1;
    it 1;
    ar 1;
    th 1;
    vi 1;
}

# 智能404处理：识别API请求类型
map $request_uri $is_api_request {
    ~^/api/ 1;
    ~^/user/(login|register|logout|updateUserInfo|getCode|getCodeForBind|updateUserSecretInfo|bindingUserSecretInfo|getUserInfo|listUser|saveUser|updatePassword|updateAdminInfo|deleteUsers|getAdminUserInfo|updateAdminConfig) 1;
    # [已迁移] ~^/python/ 不再需要单独标记
    ~^/ws/im 1;
    default 0;
}

# 空 User-Agent 识别（爬虫/扫描器典型特征：抹除UA）
# 正常浏览器一定携带 UA；空 UA 或仅"-"几乎必为恶意探测
map $http_user_agent $is_empty_user_agent {
    default 0;
    "" 1;
    "-" 1;
}

server {
    listen 80;
    server_name example.com www.example.com;

    include /usr/local/openresty/nginx/conf/security/spoofed-ip-headers.conf;

    # 拦截空 User-Agent 请求（爬虫/扫描器典型特征），不重定向到HTTPS直接拒绝
    if ($is_empty_user_agent) {
        return 403;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
        try_files $uri =404;
    }

    # 将HTTP请求重定向到HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen 443 quic reuseport;
    http2 on;  # 显式启用HTTP/2
    http3 on;  # 启用HTTP/3
    server_name example.com www.example.com;

    include /usr/local/openresty/nginx/conf/security/spoofed-ip-headers.conf;

    # IP 黑名单检查 - Lua 直接查 Redis（OpenResty）
    # 在 access 阶段执行，命中黑名单的 IP 直接返回 403，连 HTML 源码也不会返回
    # fail-open：Redis 不可用时放行，避免误伤全站
    access_by_lua_file /usr/local/openresty/nginx/lua/ip_blacklist.lua;

    # 拦截空 User-Agent 请求（爬虫/扫描器典型特征）
    # 正常浏览器一定携带 UA；空 UA 或仅"-"几乎必为恶意探测
    # 返回 403 走统一 @handle_403 处理，请求不会到达后端，避免污染访问统计
    if ($is_empty_user_agent) {
        return 403;
    }

    # 设置访问日志路径
    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/page_visit.log page_visit_json if=$page_visit_loggable;

    # 智能404和403处理：API保持JSON格式，其他跳转到前端
    error_page 404 = @handle_404;
    error_page 403 = @handle_403;

    # ===== 后台管理前端 =====

    # 后台管理静态资源 - 必须在 /admin 之前定义
    location ^~ /admin/assets/ {
        alias /usr/share/nginx/html/admin/assets/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        # 确保 JS 文件返回正确的 MIME 类型
        types {
            application/javascript js mjs;
            text/css css;
        }
    }

    # 后台管理静态资源（主要路径）
    location ^~ /admin/static/ {
        alias /usr/share/nginx/html/admin/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        # 确保静态资源返回正确的 MIME 类型
        types {
            application/javascript js mjs;
            text/css css;
            image/svg+xml svg svgz;
            image/png png;
            image/jpeg jpg jpeg;
            image/gif gif;
            image/webp webp;
        }
    }

    # 后台管理前端 - SPA 路由
    location ^~ /admin {
        alias /usr/share/nginx/html/admin;
        index index.html;

        # 优先使用后台预渲染入口；没有预渲染文件时回退到原始 SPA
        try_files $uri $uri/ /prerender/index.html @admin_fallback;

        # 为index.html设置不缓存
        location = /admin/index.html {
            root /usr/share/nginx/html;
            try_files /admin/prerender/index.html /admin/index.html =404;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
        }
    }

    # 后台管理 SPA 回退
    location @admin_fallback {
        root /usr/share/nginx/html;
        try_files /admin/prerender/index.html /admin/index.html =404;
    }

    # ===== API 路由配置（优先级高于安全规则） =====

    # Java后端API（/api/前缀，去掉前缀后转发）
    location ^~ /api/ {
        proxy_pass http://poetize-java/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $forwarded_for_chain;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }


    # Java后端用户相关API - 只匹配具体的API端点，避免拦截前端路由
    location ~ ^/user/(login|register|logout|updateUserInfo|getCode|getCodeForBind|updateUserSecretInfo|bindingUserSecretInfo|getUserInfo|listUser|saveUser|updatePassword|updateAdminInfo|deleteUsers|getAdminUserInfo|updateAdminConfig) {
        proxy_pass http://poetize-java;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $forwarded_for_chain;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # [已迁移] Python后端API → 转发到Java后端
    location ^~ /python/ {
        proxy_pass http://poetize-java/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $forwarded_for_chain;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # OAuth第三方登录路由到Java后端（从Python迁移）
    location ^~ /login/ {
        # 重写路径: /login/github -> /oauth/login/github
        rewrite ^/login/(.*)$ /oauth/login/$1 break;

        proxy_pass http://poetize-java;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $forwarded_for_chain;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_redirect off;
    }

    # OAuth回调路由到Java后端（从Python迁移）
    location ^~ /callback/ {
        # 重写路径: /callback/github -> /oauth/callback/github
        rewrite ^/callback/(.*)$ /oauth/callback/$1 break;

        proxy_pass http://poetize-java;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $forwarded_for_chain;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_redirect off;
    }

    # SEO静态文件路由到Java端
    location = /manifest.json {
        proxy_pass http://poetize-java/seo/manifest.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $forwarded_for_chain;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache";
    }

    # favicon.ico 兼容根路径访问
    location = /favicon.ico {
        proxy_pass http://poetize-java/seo/favicon.ico;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $forwarded_for_chain;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /robots.txt {
        proxy_pass http://poetize-java/seo/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $forwarded_for_chain;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=3600";
    }

    # IndexNow 验证文件 - 搜索引擎（Bing/Yandex等）通过此文件验证站点所有权
    # 匹配根目录下符合 IndexNow key 格式的 .txt 文件请求
    # @see https://www.indexnow.org/documentation
    location ~ "^/([a-zA-Z0-9\-]{8,128})\.txt$" {
        proxy_pass http://poetize-java/$1.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $forwarded_for_chain;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=86400";
    }

    # PWA Service Worker
    location = /sw.js {
        root /usr/share/nginx/html/poetize;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Content-Type "application/javascript; charset=utf-8";
        add_header Service-Worker-Allowed "/";
    }

    # Spring WebSocket 端点（集成到主应用端口 8081）
    location ^~ /ws/im {
        proxy_pass          http://poetize-java/ws/im;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $real_client_ip;
        proxy_set_header    X-Forwarded-For $forwarded_for_chain;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  600s;
    }

    # ===== 安全防护规则 =====

    # 0. 拦截所有 .php 请求（本站为 Java 应用，不存在任何 PHP 文件）
    # 所有 .php 请求均为扫描器/僵尸网络对 webshell 与 WordPress 漏洞的探测
    # 直接 444 断开连接：零带宽消耗、不泄露任何信息、不触发 error_page 跳转首页
    # 注意：用负向先行断言排除 /static/articleFile/，保留用户上传的 .php 附件走强制下载规则
    location ~ ^(?!/static/articleFile/).*\.php$ {
        return 444;
    }

    # 1. 防止目录遍历攻击
    location ~* \.\./  {
        return 403 "Directory traversal not allowed";
    }

    # 2. 禁止访问隐藏文件和目录（排除.well-known以支持SSL证书验证）
    location ~ /\.(?!well-known/) {
        return 403 "Access to hidden files denied";
    }

    # 3. 禁止访问敏感文件类型
    # 排除 /static/articleFile/ 以保留用户上传的 .sql/.conf/.log 等附件走普通静态文件下载
    location ~* ^(?!/static/articleFile/).*\.(htaccess|htpasswd|gitignore|git|env|config|conf|ini|log|sql|bak|backup|old|tmp|temp|swp|swo)$ {
        return 403 "Access to sensitive files denied";
    }

    # 4. 禁止访问系统配置目录
    location ~* /(config|configs|configuration|administrator|manager|management|system|private|secret|internal)/ {
        return 403 "Access to system directories denied";
    }

    # 5. 拦截 WordPress 相关路径（本站非 WordPress，所有 wp-* 请求均为扫描器探测）
    #    数据显示 /wp-admin/、/wp-json/gravitysmtp、/wp-includes/ 等被高频扫描
    location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|wp-json|wp-config) {
        return 444;
    }

    # 6. 拦截其他动态脚本后缀（本站为 Java + Vue 前后端分离，不存在 ASP/JSP/CGI/Python/Perl/Ruby 脚本）
    # 同样排除 /static/articleFile/ 以保留用户上传的脚本类附件走强制下载规则
    location ~* ^(?!/static/articleFile/).*\.(asp|aspx|jsp|cgi|pl|py|rb)$ {
        return 444;
    }

    # 7. 拦截常见管理工具与状态页探测路径
    location ~* ^/(phpmyadmin|pma|adminer|mysql|server-status|server-info|cgi-bin) {
        return 444;
    }

    # 设置默认字符集
    charset utf-8;

    # SSL证书配置
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/example.com/chain.pem;

    # SSL设置
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HTTPS安全头使用 Nginx 原生 add_header 设置
    add_header Alt-Svc 'h3=":443"; ma=86400';
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' *.jsdelivr.net cdn.jsdelivr.net *.cloudflare.com cdnjs.cloudflare.com *.unpkg.com unpkg.com; style-src 'self' 'unsafe-inline' *.jsdelivr.net *.cloudflare.com cdnjs.cloudflare.com fonts.googleapis.com *.unpkg.com unpkg.com; img-src 'self' data: blob: *; font-src 'self' data: *; connect-src 'self' *;" always;

    # 限制请求大小，防止DoS攻击
    client_max_body_size 10M;

    # 启用Brotli压缩 - 比GZIP更高效的压缩算法
    brotli on;
    brotli_comp_level 6;
    brotli_static on;
    brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/x-font-ttf application/x-font-opentype application/font-woff application/font-woff2 font/woff2 image/svg+xml;

    # Let's Encrypt 已移除 OCSP URL，显式关闭 stapling 避免无意义告警
    ssl_stapling off;
    ssl_stapling_verify off;

    # 启用GZIP压缩，但避免对已加密内容进行压缩
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 内部代理location - 仅供内部请求使用
    location /internal_proxy/ {
        internal;
        # 移除/internal_proxy前缀
        rewrite ^/internal_proxy(/.*)$ $1 break;
        proxy_pass http://poetize-java;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $forwarded_for_chain;
        proxy_set_header X-Forwarded-Proto $scheme;
        try_files $uri $uri/ /index.html;
    }

    # 翻译文章页静态预渲染 - 新格式 /article/lang/id-or-slug
    location ~ ^/article/([a-zA-Z-]+)/([A-Za-z0-9-]+)$ {
        root /usr/share/nginx/html/poetize;
        # $1=语言代码, $2=文章ID
        # 预渲染文件路径：/prerender/article/123/index-en.html
        try_files /prerender/article/$2/index-$1.html /prerender/article/$2/index.html @spa_article;
    }

    # 原文文章页静态预渲染 - 格式 /article/id-or-slug
    location ~ ^/article/([A-Za-z0-9-]+)(\?.*)?$ {
        root /usr/share/nginx/html/poetize;
        # 根据 $lang_suffix 智能选择文件：en->index-en.html，否则 index.html
        try_files /prerender/article/$1/index$lang_suffix.html /prerender/article/$1/index.html @spa_article;
    }
    location @spa_article {
        root /usr/share/nginx/html/poetize;
        try_files $uri $uri/ /index.html;
    }

    # 首页静态预渲染
    location = / {
        root /usr/share/nginx/html/poetize;
        try_files /prerender/home/index$lang_suffix.html /prerender/home/index.html @spa_home;
    }
    location @spa_home {
        root /usr/share/nginx/html/poetize;
        try_files $uri $uri/ /index.html;
    }

    # 旧版SEO入口兼容：归档页归到首页，分类/标签页归到分类导航页
    location ~ ^/archives/?$ {
        return 301 /$is_args$args;
    }
    location ~ ^/(categories|tags)/?$ {
        return 301 /sort$is_args$args;
    }

    # 百宝箱页面（前端重定向，无需预渲染）
    location = /favorite {
        root /usr/share/nginx/html/poetize;
        try_files $uri $uri/ /index.html;
    }

    # 友人帐页面静态预渲染
    location = /friends {
        root /usr/share/nginx/html/poetize;
        try_files /prerender/friends/index$lang_suffix.html /prerender/friends/index.html @spa_friends;
    }
    location @spa_friends {
        root /usr/share/nginx/html/poetize;
        try_files $uri $uri/ /index.html;
    }

    # 曲乐页面静态预渲染
    location = /music {
        root /usr/share/nginx/html/poetize;
        try_files /prerender/music/index$lang_suffix.html /prerender/music/index.html @spa_music;
    }
    location @spa_music {
        root /usr/share/nginx/html/poetize;
        try_files $uri $uri/ /index.html;
    }

    # 收藏夹页面静态预渲染
    location = /favorites {
        root /usr/share/nginx/html/poetize;
        try_files /prerender/favorites/index$lang_suffix.html /prerender/favorites/index.html @spa_favorites;
    }
    location @spa_favorites {
        root /usr/share/nginx/html/poetize;
        try_files $uri $uri/ /index.html;
    }

    # 关于页面静态预渲染
    location = /about {
        root /usr/share/nginx/html/poetize;
        try_files /prerender/about/index$lang_suffix.html /prerender/about/index.html @spa_about;
    }
    location @spa_about {
        root /usr/share/nginx/html/poetize;
        try_files $uri $uri/ /index.html;
    }

    # 留言板页面静态预渲染
    location = /message {
        root /usr/share/nginx/html/poetize;
        try_files /prerender/message/index$lang_suffix.html /prerender/message/index.html @spa_message;
    }
    location @spa_message {
        root /usr/share/nginx/html/poetize;
        try_files $uri $uri/ /index.html;
    }

    # 微言页面静态预渲染
    location = /weiYan {
        root /usr/share/nginx/html/poetize;
        try_files /prerender/weiYan/index$lang_suffix.html /prerender/weiYan/index.html @spa_weiyan;
    }
    location @spa_weiyan {
        root /usr/share/nginx/html/poetize;
        try_files $uri $uri/ /index.html;
    }

    # 恋爱记录页面静态预渲染
    location = /love {
        root /usr/share/nginx/html/poetize;
        try_files /prerender/love/index$lang_suffix.html /prerender/love/index.html @spa_love;
    }
    location @spa_love {
        root /usr/share/nginx/html/poetize;
        try_files $uri $uri/ /index.html;
    }

    # 旅行日记页面静态预渲染
    location = /travel {
        root /usr/share/nginx/html/poetize;
        try_files /prerender/travel/index$lang_suffix.html /prerender/travel/index.html @spa_travel;
    }
    location @spa_travel {
        root /usr/share/nginx/html/poetize;
        try_files $uri $uri/ /index.html;
    }

    # 隐私政策页面静态预渲染
    location = /privacy {
        root /usr/share/nginx/html/poetize;
        try_files /prerender/privacy/index$lang_suffix.html /prerender/privacy/index.html @spa_privacy;
    }
    location @spa_privacy {
        root /usr/share/nginx/html/poetize;
        try_files $uri $uri/ /index.html;
    }


    # 信件页面静态预渲染
    location = /letter {
        root /usr/share/nginx/html/poetize;
        try_files /prerender/letter/index$lang_suffix.html /prerender/letter/index.html @spa_letter;
    }
    location @spa_letter {
        root /usr/share/nginx/html/poetize;
        try_files $uri $uri/ /index.html;
    }


    # Sort页面静态预渲染
    location ~ ^/sort/([0-9]+)$ {
        root /usr/share/nginx/html/poetize;
        try_files /prerender/sort/$1/$label_id/index$lang_suffix.html /prerender/sort/$1/$label_id/index.html /prerender/sort/$1/index$lang_suffix.html /prerender/sort/$1/index.html @spa_sort;
    }

    # 处理纯 /sort 路径（无分类ID）
    location = /sort {
        root /usr/share/nginx/html/poetize;
        try_files /prerender/sort/index$lang_suffix.html /prerender/sort/index.html @spa_sort;
    }

    location @spa_sort {
        root /usr/share/nginx/html/poetize;
        try_files $uri $uri/ /index.html;
    }

    # 智能404处理器
    location @handle_404 {
        # API请求返回JSON格式404
        if ($is_api_request = 1) {
            add_header Content-Type application/json always;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Accept, Authorization, Cache-Control, Content-Type, DNT, If-Modified-Since, Keep-Alive, Origin, User-Agent, X-Requested-With' always;
            return 404 '{"code":404,"message":"接口不存在","data":null,"timestamp":"$time_iso8601"}';
        }

        # 静态资源和页面请求跳转到前端SPA，由Vue Router处理404
        root /usr/share/nginx/html/poetize;
        rewrite ^.*$ /index.html last;
    }

    # 智能403处理器
    location @handle_403 {
        # API请求返回JSON格式403
        if ($is_api_request = 1) {
            add_header Content-Type application/json always;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Accept, Authorization, Cache-Control, Content-Type, DNT, If-Modified-Since, Keep-Alive, Origin, User-Agent, X-Requested-With' always;
            return 403 '{"code":403,"message":"访问被拒绝：请求被安全系统拦截","data":null,"timestamp":"$time_iso8601"}';
        }

        # 页面请求返回 bare 403（不服务 SPA 源码，防止被封禁 IP 抓取网站内容）
        default_type text/html;
        return 403 "<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>403 Forbidden</title></head><body><h1>403 Forbidden</h1><p>访问被拒绝。</p></body></html>";
    }

    # 主站前端
    location / {
        root /usr/share/nginx/html/poetize;
        index index.html;


        try_files $uri $uri/ /index.html;

        # Live2D资源预加载 - 使用JavaScript preload代替http2_push
        # 注：HTTP/3不支持Server Push，改用<link rel="preload">方式
        location = /index.html {
            root /usr/share/nginx/html/poetize;
            # 为index.html设置不缓存，确保用户总能获取最新的应用入口
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";

            # Live2D资源现在由前端动态preload，避免重复预加载
            # add_header Link '</static/live2d-widget/dist/live2d.min.js>; rel=preload; as=script';
            # add_header Link '</static/live2d-widget/dist/waifu.css>; rel=preload; as=style';
            # Live2D 模型包已改为按需本地安装或 CDN 加载，不再默认预加载 model_list.json。
        }
    }

    # Let's Encrypt验证
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
        # ACME验证文件如果不存在应该返回真正的404，不跳转到前端页面
        try_files $uri =404;
    }


    # 聊天室前端静态资源
    # 使用 ^~ 前缀匹配并要比 ^~ /im 更具体，确保优先于 SPA location 命中
    location ^~ /im/css/ {
        root /usr/share/nginx/html/poetize;
        expires 30d;
        add_header Cache-Control "public, no-transform";

        location ~* \.css$ {
            add_header Content-Type text/css;
        }

        try_files $uri @handle_404;
    }
    location ^~ /im/js/ {
        root /usr/share/nginx/html/poetize;
        expires 30d;
        add_header Cache-Control "public, no-transform";

        location ~* \.js$ {
            add_header Content-Type application/javascript;
        }

        try_files $uri @handle_404;
    }
    location ^~ /im/static/ {
        root /usr/share/nginx/html/poetize;
        expires 30d;
        add_header Cache-Control "public, no-transform";

        try_files $uri @handle_404;
    }

    # 聊天室页面 - SPA路由处理（使用^~优先匹配，跳过通用SEO处理）
    location ^~ /im {
        root /usr/share/nginx/html/poetize;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # assets目录 - 直接指向static/assets
    location /assets/ {
        alias /usr/share/nginx/html/poetize/static/assets/;
        expires 30d;
        add_header Cache-Control "public, no-transform";

        # assets文件如果不存在，使用智能404处理器
        try_files $uri @handle_404;

        # 特殊处理视频文件，支持流式传输
        location ~* \.(mp4|webm|ogg|avi|mov|flv|wmv|mkv)$ {
            alias /usr/share/nginx/html/poetize/static/assets/;

            # 防盗链保护 - 只允许本站和空referer访问
            valid_referers none blocked server_names ~\.example\.com$ example.com;
            if ($invalid_referer) {
                return 403 "Hotlinking not allowed";
            }

            # 启用HTTP Range请求支持，允许视频流式加载
            add_header Accept-Ranges bytes;

            # 设置适当的MIME类型
            location ~* \.mp4$ {
                add_header Content-Type video/mp4;
            }
            location ~* \.webm$ {
                add_header Content-Type video/webm;
            }
            location ~* \.ogg$ {
                add_header Content-Type video/ogg;
            }

            # 视频文件缓存策略 - 较长缓存但允许验证
            expires 7d;
            add_header Cache-Control "public, max-age=604800, must-revalidate";

            # 启用sendfile和tcp_nopush优化大文件传输
            sendfile on;
            tcp_nopush on;
            tcp_nodelay off;

            # 支持跨域访问（如果需要）
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
            add_header Access-Control-Allow-Headers 'Range';

            # 禁用gzip和brotli压缩（视频文件已经压缩过了）
            gzip off;
            brotli off;
        }
    }

    # IM聊天室静态资源处理,解决poetize-im-ui的/im/static/路径问题
    location /im/static/ {
        alias /usr/share/nginx/html/poetize/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";

        # 如果文件不存在，使用智能404处理器
        try_files $uri @handle_404;
    }

    # 编辑器附件兜底：可执行/脚本类文件即使被直接访问，也强制下载
    location ~* ^/static/articleFile/(.*\.(exe|dll|bat|cmd|com|msi|jar|class|scr|vbs|vbe|js|jse|wsf|wsh|ps1|sh|bash|zsh|py|pyc|pyw|pl|perl|rb|go|rs|rust|c|cpp|cc|cxx|php|php3|php4|php5|phtml|phar|jsp|jspx|jsf|jspa|jhtml|asp|aspx|asa|asax|ascx|ashx|asmx|docm|xlsm|pptm))$ {
        alias /usr/share/nginx/html/uploads/articleFile/$1;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff";
    }

    # 静态资源 - 优先从uploads目录找上传文件，然后回退到前端静态资源
    location /static {
        # 首先尝试从独立的uploads目录找上传的文件，去掉/static前缀
        alias /usr/share/nginx/html/uploads;
        try_files $uri @fallback_static;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 为特定的chunk JS文件添加特殊处理
    location ~* chunk-.*\.js$ {
        root /usr/share/nginx/html/poetize;
        # 设置正确的MIME类型
        types { application/javascript js; }
        # 这些是带哈希版本号的JS文件，内容不变则文件名不变，应该被永久缓存。
        # 禁用压缩可以避免对可能已压缩过的现代JS包进行二次压缩
        gzip off;
        brotli off;
        # 启用永久缓存
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # 记录详细的访问日志用于调试
        access_log /var/log/nginx/chunk_debug.log main;
        # 如果chunk文件不存在，使用智能404处理器
        try_files $uri @handle_404;
    }

    # Live2D模型和相关资源 - 专门优化Live2D资源的缓存
    location ^~ /static/live2d_api/ {
        root /usr/share/nginx/html/poetize;
        expires max;  # 使用最长缓存时间，因为模型文件很少变化
        add_header Cache-Control "public, max-age=31536000, immutable";

        # 配置跨域
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS';

        # 特别优化model_list.json的缓存
        location ~ model_list\.json$ {
            expires 1d;  # 模型列表可能会更新，使用较短的缓存时间
            add_header Cache-Control "public, max-age=86400";
        }

        # 禁用access_log以减少磁盘IO
        access_log off;
        error_page 404 = @live2d_static_404;

        # Live2D文件如果不存在，直接返回404，避免把HTML首页当成模型JSON/贴图
        try_files $uri =404;
    }

    # Live2D小部件JS和CSS资源
    location ^~ /static/live2d-widget/ {
        root /usr/share/nginx/html/poetize;
        expires 7d;  # 一周的缓存时间
        add_header Cache-Control "public, max-age=604800";

        # 禁用access_log以减少磁盘IO
        access_log off;
        error_page 404 = @live2d_static_404;

        # Live2D小部件文件如果不存在，直接返回404，避免把HTML首页当成JS执行
        try_files $uri =404;
    }

    location @live2d_static_404 {
        add_header Cache-Control "no-store";
        return 404;
    }
    # 静态资源回退路径
    location @fallback_static {
        root /usr/share/nginx/html/poetize;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        # 如果在前端静态资源中也找不到，使用智能404处理器
        try_files $uri @handle_404;
    }

    # 站点地图 - 代理到Java后端动态生成
    location /sitemap.xml {
        proxy_pass http://poetize-java;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $forwarded_for_chain;
        proxy_set_header X-Forwarded-Proto $scheme;

        # sitemap缓存设置
        add_header Cache-Control "public, max-age=3600";

        # 设置正确的Content-Type
        proxy_set_header Accept "application/xml";
    }

}
