<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <!-- 阻止浏览器强制暗色模式，我们自己处理颜色主题 -->
    <meta name="color-scheme" content="light dark">
    <title></title>

    <!-- 静态CSS资源 -->
    <link rel="stylesheet" href="/static/css/inline-styles.css">
    
    <!-- 自动检测 Vite 预加载失败并刷新恢复，防止新部署后旧 chunk 失效导致白屏 -->
    <script>
      (function handlePreloadError() {
        function reloadPage(reason) {
          var key = 'assets-reload-timestamp';
          var lastReload = sessionStorage.getItem(key);
          var now = Date.now();
          // 限制 10 秒内只能自动刷新一次，避免因网络彻底断开等原因导致无限循环刷新
          if (!lastReload || now - parseInt(lastReload) > 10000) {
            sessionStorage.setItem(key, now.toString());
            console.warn('检测到 Vite 预加载失败 (' + reason + ')，正在自动刷新页面恢复...');
            // 先尝试注销 Service Worker，避免旧缓存导致刷新后仍然加载失败的 chunk
            if (navigator.serviceWorker) {
              navigator.serviceWorker.getRegistrations().then(function(registrations) {
                return Promise.all(registrations.map(function(reg) { return reg.unregister(); }));
              }).catch(function() {}).finally(function() {
                window.location.reload(true);
              });
            } else {
              window.location.reload(true);
            }
          }
        }

        // 仅捕获 Vite 动态 import / preload 加载失败
        // 不再监听全局 SCRIPT/LINK error：非关键资源（背景图、CDN、代理样式等）加载失败不应触发整页刷新
        window.addEventListener('vite:preloadError', function (event) {
          reloadPage('preloadError');
        });
      })();
    </script>
    <!-- SEO相关元数据占位符 - 将由Nginx动态替换 -->
    <!-- SEO_META_PLACEHOLDER -->
</head>

<body>
    <!-- 快速设置标题，减少闪烁 -->
    <script>
        (function () {
            try {
                var cachedWebInfo = localStorage.getItem('webInfo');
                if (cachedWebInfo) {
                    var webInfoData = JSON.parse(cachedWebInfo);
                    if (webInfoData && webInfoData.data && webInfoData.data.webTitle) {
                        document.title = webInfoData.data.webTitle;
                        window.OriginTitile = webInfoData.data.webTitle;
                    }
                }
            } catch (e) {
            }
        })();
    </script>

    <!-- 自动检测暗色模式，避免闪烁 -->
    <script>
        (function () {
            try {
                // 获取用户手动设置的主题偏好
                var userTheme = localStorage.getItem('theme');
                // 检测系统暗色模式
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

                // 优先级：用户设置 > 系统偏好
                // 如果用户设置了dark，或者用户没设置且系统是暗色
                if (userTheme === 'dark' || (userTheme !== 'light' && prefersDark)) {
                    document.documentElement.classList.add('dark-mode');
                    document.body.classList.add('dark-mode');

                    // 立即设置CSS变量，避免闪烁
                    var root = document.documentElement;
                    root.style.setProperty("--background", "#272727");
                    root.style.setProperty("--fontColor", "white");
                    root.style.setProperty("--borderColor", "#4F4F4F");
                    root.style.setProperty("--borderHoverColor", "black");
                    root.style.setProperty("--articleFontColor", "#E4E4E4");
                    root.style.setProperty("--articleGreyFontColor", "#D4D4D4");
                    root.style.setProperty("--commentContent", "#383838");
                    root.style.setProperty("--favoriteBg", "#1e1e1e");
                    root.style.setProperty("--whiteMask", "rgba(56, 56, 56, 0.3)");
                    root.style.setProperty("--maxWhiteMask", "rgba(56, 56, 56, 0.5)");
                    root.style.setProperty("--maxMaxWhiteMask", "rgba(56, 56, 56, 0.7)");
                    root.style.setProperty("--miniWhiteMask", "rgba(56, 56, 56, 0.15)");
                    root.style.setProperty("--mask", "rgba(0, 0, 0, 0.5)");
                    root.style.setProperty("--miniMask", "rgba(0, 0, 0, 0.3)");
                    root.style.setProperty("--inputBackground", "#383838");
                    root.style.setProperty("--secondaryText", "#B0B0B0");
                    root.style.setProperty("--card-bg-rgb", "39, 39, 39");
                }
            } catch (e) {
            }
        })();
    </script>
    <!-- 顶部加载进度条 -->
    <div id="top-loading-bar" aria-hidden="true"><div id="tlb-fill"></div>
      <style>
        #top-loading-bar{position:fixed;top:0;left:0;width:100%;height:3px;z-index:99999;pointer-events:none;transition:opacity .4s ease}
        #top-loading-bar.done{opacity:0}
        #tlb-fill{height:100%;width:0;border-radius:0 2px 2px 0;background:#66BB6A;transition:width .3s ease}
      </style>
    </div>
    <script>
      (function(){
        var bar=document.getElementById('top-loading-bar');
        var fill=document.getElementById('tlb-fill');
        if(!bar||!fill)return;
        var total=0,loaded=0,finished=false;
        function update(){
          if(finished)return;
          var pct=total>0?Math.min(Math.round(loaded/total*90),90):5;
          fill.style.width=pct+'%';
        }
        function trackEl(el){
          if(el.dataset.tlbTracked)return;
          el.dataset.tlbTracked='1';
          total++;update();
          el.addEventListener('load',function(){loaded++;update()});
          el.addEventListener('error',function(){loaded++;update()});
        }
        document.querySelectorAll('script[src],link[rel="modulepreload"],link[rel="stylesheet"]').forEach(trackEl);
        var mo=new MutationObserver(function(muts){
          muts.forEach(function(m){m.addedNodes.forEach(function(n){
            if(n.nodeType!==1)return;
            if(n.tagName==='SCRIPT'&&n.src)trackEl(n);
            else if(n.tagName==='LINK'&&(n.rel==='modulepreload'||n.rel==='stylesheet'))trackEl(n);
          })});
        });
        mo.observe(document.head,{childList:true,subtree:true});
        update();
        function done(){
          if(finished)return;
          finished=true;mo.disconnect();
          fill.style.width='100%';
          setTimeout(function(){bar.classList.add('done');setTimeout(function(){bar.remove()},500)},200);
        }
        window.addEventListener('app-mounted',function(){setTimeout(done,300)},{once:true});
        setTimeout(done,30000);
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
