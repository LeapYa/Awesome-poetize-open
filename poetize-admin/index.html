<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <!-- 阻止浏览器强制暗色模式，我们自己处理颜色主题 -->
    <meta name="color-scheme" content="light dark">
    <title></title>

    <!-- 静态CSS资源 -->
    <link rel="stylesheet" href="/static/css/inline-styles.css">
    
    <!-- 自动检测 Vite 预加载失败并刷新恢复，防止新部署后旧 chunk 失效导致白屏 -->
    <script>
      (function handlePreloadError() {
        function reloadPage(reason) {
          var key = 'assets-reload-timestamp';
          var lastReload = sessionStorage.getItem(key);
          var now = Date.now();
          // 限制 10 秒内只能自动刷新一次，避免因网络彻底断开等原因导致无限循环刷新
          if (!lastReload || now - parseInt(lastReload) > 10000) {
            sessionStorage.setItem(key, now.toString());
            console.warn('检测到 Vite 预加载失败 (' + reason + ')，正在自动刷新页面恢复...');
            // 先尝试注销 Service Worker，避免旧缓存导致刷新后仍然加载失败的 chunk
            if (navigator.serviceWorker) {
              navigator.serviceWorker.getRegistrations().then(function(registrations) {
                return Promise.all(registrations.map(function(reg) { return reg.unregister(); }));
              }).catch(function() {}).finally(function() {
                window.location.reload(true);
              });
            } else {
              window.location.reload(true);
            }
          }
        }

        // 仅捕获 Vite 动态 import / preload 加载失败
        // 不再监听全局 SCRIPT/LINK error：非关键资源（背景图、CDN、代理样式等）加载失败不应触发整页刷新
        window.addEventListener('vite:preloadError', function (event) {
          reloadPage('preloadError');
        });
      })();
    </script>
    <!-- SEO相关元数据占位符 - 将由Nginx动态替换 -->
    <!-- SEO_META_PLACEHOLDER -->
</head>

<body>
    <!-- 快速设置标题，减少闪烁 -->
    <script>
        (function () {
            try {
                var cachedWebInfo = localStorage.getItem('webInfo');
                if (cachedWebInfo) {
                    var webInfoData = JSON.parse(cachedWebInfo);
                    if (webInfoData && webInfoData.data && webInfoData.data.webTitle) {
                        document.title = webInfoData.data.webTitle;
                        window.OriginTitile = webInfoData.data.webTitle;
                    }
                }
            } catch (e) {
            }
        })();
    </script>

    <!-- 自动检测暗色模式，避免闪烁 -->
    <script>
        (function () {
            try {
                // 获取用户手动设置的主题偏好
                var userTheme = localStorage.getItem('theme');
                // 检测系统暗色模式
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

                // 优先级：用户设置 > 系统偏好
                // 如果用户设置了dark，或者用户没设置且系统是暗色
                if (userTheme === 'dark' || (userTheme !== 'light' && prefersDark)) {
                    document.documentElement.classList.add('dark-mode');
                    document.body.classList.add('dark-mode');

                    // 立即设置CSS变量，避免闪烁
                    var root = document.documentElement;
                    root.style.setProperty("--background", "#272727");
                    root.style.setProperty("--fontColor", "white");
                    root.style.setProperty("--borderColor", "#4F4F4F");
                    root.style.setProperty("--borderHoverColor", "black");
                    root.style.setProperty("--articleFontColor", "#E4E4E4");
                    root.style.setProperty("--articleGreyFontColor", "#D4D4D4");
                    root.style.setProperty("--commentContent", "#383838");
                    root.style.setProperty("--favoriteBg", "#1e1e1e");
                    root.style.setProperty("--whiteMask", "rgba(56, 56, 56, 0.3)");
                    root.style.setProperty("--maxWhiteMask", "rgba(56, 56, 56, 0.5)");
                    root.style.setProperty("--maxMaxWhiteMask", "rgba(56, 56, 56, 0.7)");
                    root.style.setProperty("--miniWhiteMask", "rgba(56, 56, 56, 0.15)");
                    root.style.setProperty("--mask", "rgba(0, 0, 0, 0.5)");
                    root.style.setProperty("--miniMask", "rgba(0, 0, 0, 0.3)");
                    root.style.setProperty("--inputBackground", "#383838");
                    root.style.setProperty("--secondaryText", "#B0B0B0");
                    root.style.setProperty("--card-bg-rgb", "39, 39, 39");
                }
            } catch (e) {
            }
        })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
