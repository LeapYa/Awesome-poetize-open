<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    
    <!-- 阻止浏览器强制暗色模式，我们自己处理颜色主题 -->
    <meta name="color-scheme" content="light dark">
    
    <!-- 静态CSS资源（异步加载，不阻塞首屏进度条渲染） -->
    <!-- 以下CSS已改为按需加载：highlight.min.css, katex.min.css -->
    <link rel="stylesheet" href="/static/css/inline-styles.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="/static/css/inline-styles.css"></noscript>
    <title></title>
    <!-- SEO相关元数据占位符 - 将由Nginx动态替换 -->
    <!-- SEO_META_PLACEHOLDER -->
</head>
<body>
<!-- 顶部加载进度条：实时追踪JS/CSS资源加载进度，Vue挂载前即可渲染 -->
<div id="top-loading-bar" aria-hidden="true"><div id="tlb-fill"></div>
    <style>
        #top-loading-bar{position:fixed;top:0;left:0;width:100%;height:4px;z-index:99999;pointer-events:none;transition:opacity .4s ease}
        #top-loading-bar.done{opacity:0}
        #tlb-fill{height:100%;width:0;border-radius:0 2px 2px 0;background:#66BB6A;transition:width .3s ease}
    </style>
</div>
<script>
(function(){
    var bar=document.getElementById('top-loading-bar');
    var fill=document.getElementById('tlb-fill');
    if(!bar||!fill)return;
    var total=0,loaded=0,finished=false,appMounted=false;
    function update(){
        if(finished)return;
        var pct=total>0?Math.min(Math.round(loaded/total*90),90):5;
        fill.style.width=pct+'%';
        tryFinish();
    }
    function trackEl(el){
        if(el.dataset.tlbTracked)return;
        el.dataset.tlbTracked='1';
        total++;update();
        el.addEventListener('load',function(){loaded++;update()});
        el.addEventListener('error',function(){loaded++;update()});
        if(el.complete){loaded++;update()}
    }
    function scanNode(node){
        if(node.nodeType!==1)return;
        if(node.tagName==='SCRIPT'&&node.src)trackEl(node);
        else if(node.tagName==='LINK'&&(node.rel==='modulepreload'||node.rel==='stylesheet'))trackEl(node);
        else if(node.tagName==='IMG'&&node.src)trackEl(node);
        if(node.querySelectorAll){
            node.querySelectorAll('img[src]').forEach(trackEl);
        }
    }
    document.querySelectorAll('script[src],link[rel="modulepreload"],link[rel="stylesheet"]').forEach(trackEl);
    var mo=new MutationObserver(function(muts){
        muts.forEach(function(m){m.addedNodes.forEach(scanNode)});
    });
    mo.observe(document.head,{childList:true,subtree:true});
    mo.observe(document.body,{childList:true,subtree:true});
    update();
    function done(){
        if(finished)return;
        finished=true;mo.disconnect();
        fill.style.width='100%';
        setTimeout(function(){bar.classList.add('done');setTimeout(function(){bar.remove()},500)},200);
    }
    function tryFinish(){
        if(!appMounted||finished)return;
        if(total>0&&loaded>=total){setTimeout(done,200)}
    }
    window.addEventListener('app-mounted',function(){
        appMounted=true;
        tryFinish();
        setTimeout(done,5000);
    },{once:true});
    setTimeout(done,30000);
})();
</script>
<!-- 快速设置标题，减少闪烁 -->
<script>
(function() {
    try {
        var cachedWebInfo = localStorage.getItem('webInfo');
        if (cachedWebInfo) {
            var webInfoData = JSON.parse(cachedWebInfo);
            if (webInfoData && webInfoData.data) {
                var tabTitle = webInfoData.data.webTitle || webInfoData.data.webName;
                if (tabTitle) {
                    document.title = tabTitle;
                    window.OriginTitile = tabTitle;
                }
            }
        }
    } catch (e) {
        // 静默处理错误，不影响页面加载
    }
})();
</script>

<!-- 自动检测暗色模式，避免闪烁 -->
<script>
(function() {
    try {
        // 获取用户手动设置的主题偏好
        var userTheme = localStorage.getItem('theme');
        // 检测系统暗色模式
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        // 优先级：用户设置 > 系统偏好
        // 如果用户设置了dark，或者用户没设置且系统是暗色
        if (userTheme === 'dark' || (userTheme !== 'light' && prefersDark)) {
            document.documentElement.classList.add('dark-mode');
            document.body.classList.add('dark-mode');
            
            // 立即设置CSS变量，避免闪烁
            var root = document.documentElement;
            root.style.setProperty("--background", "#272727");
            root.style.setProperty("--fontColor", "white");
            root.style.setProperty("--borderColor", "#4F4F4F");
            root.style.setProperty("--borderHoverColor", "black");
            root.style.setProperty("--articleFontColor", "#E4E4E4");
            root.style.setProperty("--articleGreyFontColor", "#D4D4D4");
            root.style.setProperty("--commentContent", "#383838");
            root.style.setProperty("--favoriteBg", "#1e1e1e");
            root.style.setProperty("--whiteMask", "rgba(56, 56, 56, 0.3)");
            root.style.setProperty("--maxWhiteMask", "rgba(56, 56, 56, 0.5)");
            root.style.setProperty("--maxMaxWhiteMask", "rgba(56, 56, 56, 0.7)");
            root.style.setProperty("--miniWhiteMask", "rgba(56, 56, 56, 0.15)");
            root.style.setProperty("--mask", "rgba(0, 0, 0, 0.5)");
            root.style.setProperty("--miniMask", "rgba(0, 0, 0, 0.3)");
            root.style.setProperty("--inputBackground", "#383838");
            root.style.setProperty("--secondaryText", "#B0B0B0");
            root.style.setProperty("--card-bg-rgb", "39, 39, 39");
        }
    } catch (e) {
        // 静默处理错误
    }
})();
</script>
<div id="app"></div>
<script src="/libs/js/anime.min.js"></script>
