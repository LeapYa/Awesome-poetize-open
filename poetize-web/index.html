<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">

  <!-- 声明网站支持亮色和暗色模式，由网站自己控制 -->
  <meta name="color-scheme" content="light dark">
  <!-- 阻止移动端浏览器（如OPPO/小米/华为）强制暗色模式 -->
  <meta name="nightmode" content="disable">
  <meta name="force-rendering" content="webkit">
  <meta name="renderer" content="webkit">
  <meta name="wap-font-scale" content="no">
  <title></title>

  <!-- 静态CSS资源（异步加载，不阻塞首屏进度条渲染） -->
  <link rel="stylesheet" href="/static/css/inline-styles.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="/static/css/inline-styles.css"></noscript>
  
  <!-- 自动检测更新或资源加载失败，并自动刷新恢复，防止白屏 -->
  <script>
    (function handleAssetsLoadError() {
      function reloadPage(reason) {
        var key = 'assets-reload-timestamp';
        var lastReload = sessionStorage.getItem(key);
        var now = Date.now();
        // 限制 10 秒内只能自动刷新一次，避免因网络彻底断开等原因导致无限循环刷新
        if (!lastReload || now - parseInt(lastReload) > 10000) {
          sessionStorage.setItem(key, now.toString());
          console.warn('检测到资源加载失败 (' + reason + ')，正在自动刷新页面恢复...');
          // 先尝试注销 Service Worker，避免旧缓存导致刷新后仍然加载失败的 chunk
          if (navigator.serviceWorker) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              return Promise.all(registrations.map(function(reg) { return reg.unregister(); }));
            }).catch(function() {}).finally(function() {
              window.location.reload(true);
            });
          } else {
            window.location.reload(true);
          }
        }
      }

      // 仅捕获 Vite 动态 import / preload 加载失败
      // 不再监听全局 SCRIPT/LINK error：非关键资源（背景图、CDN、代理样式等）加载失败不应触发整页刷新
      window.addEventListener('vite:preloadError', function (event) {
        // mermaid 等通过 @vite-ignore 加载的 bare module specifier 在浏览器中
        // 无法解析（没有 import map），会触发 vite:preloadError，但不应刷新页面
        var msg = (event.payload && event.payload.message) || String(event.payload || '');
        if (msg.indexOf('mermaid') !== -1) {
          console.error('mermaid module load failed (ignored):', msg);
          event.preventDefault();
          return;
        }
        reloadPage('preloadError');
      });
    })();
  </script>
</head>

<body>
  <!-- 顶部加载进度条：实时追踪JS/CSS资源加载进度，Vue挂载前即可渲染 -->
  <div id="top-loading-bar" aria-hidden="true"><div id="tlb-fill"></div>
    <style>
      #top-loading-bar{position:fixed;top:0;left:0;width:100%;height:4px;z-index:99999;pointer-events:none;transition:opacity .4s ease}
      #top-loading-bar.done{opacity:0}
      #tlb-fill{height:100%;width:0;border-radius:0 2px 2px 0;background:#66BB6A;transition:width .3s ease}
    </style>
  </div>
  <script>
    (function(){
      var bar=document.getElementById('top-loading-bar');
      var fill=document.getElementById('tlb-fill');
      if(!bar||!fill)return;
      var total=0,loaded=0,finished=false,appMounted=false;
      function update(){
        if(finished)return;
        var pct=total>0?Math.min(Math.round(loaded/total*90),90):5;
        fill.style.width=pct+'%';
        tryFinish();
      }
      function trackEl(el){
        if(el.dataset.tlbTracked)return;
        el.dataset.tlbTracked='1';
        total++;update();
        el.addEventListener('load',function(){loaded++;update()});
        el.addEventListener('error',function(){loaded++;update()});
        if(el.complete){loaded++;update()}
      }
      function scanNode(node){
        if(node.nodeType!==1)return;
        if(node.tagName==='SCRIPT'&&node.src)trackEl(node);
        else if(node.tagName==='LINK'&&(node.rel==='modulepreload'||node.rel==='stylesheet'))trackEl(node);
        else if(node.tagName==='IMG'&&node.src)trackEl(node);
        if(node.querySelectorAll){
          node.querySelectorAll('img[src]').forEach(trackEl);
        }
      }
      document.querySelectorAll('script[src],link[rel="modulepreload"],link[rel="stylesheet"]').forEach(trackEl);
      var mo=new MutationObserver(function(muts){
        muts.forEach(function(m){m.addedNodes.forEach(scanNode)});
      });
      mo.observe(document.head,{childList:true,subtree:true});
      mo.observe(document.body,{childList:true,subtree:true});
      update();
      function done(){
        if(finished)return;
        finished=true;mo.disconnect();
        fill.style.width='100%';
        setTimeout(function(){bar.classList.add('done');setTimeout(function(){bar.remove()},500)},200);
      }
      function tryFinish(){
        if(!appMounted||finished)return;
        if(total>0&&loaded>=total){setTimeout(done,200)}
      }
      window.addEventListener('app-mounted',function(){
        appMounted=true;
        setTimeout(done,300);
      },{once:true});
      setTimeout(done,30000);
    })();
  </script>
  <!-- 标题 + 暗色模式检测 -->
  <script>
    // 阻止移动端浏览器（如OPPO/小米/华为）强制暗色模式
    (function blockForcedDarkMode() {
      try {
        var style = document.createElement('style');
        style.id = 'block-forced-dark';
        style.textContent = 
          'html, body, * { ' +
            '-webkit-filter: none !important; ' +
            'filter: none !important; ' +
          '}' +
            '@media (prefers-color-scheme: dark) {' +
              'html:not(.dark-mode) {' +
                'background-color: #fff !important;' +
                'color: #333 !important;' +
              '}' +
              'html:not(.dark-mode) body {' +
                'background-color: transparent !important;' +
              '}' +
            '}';
        
        if (document.head) {
          document.head.insertBefore(style, document.head.firstChild);
        } else {
          document.addEventListener('DOMContentLoaded', function() {
            document.head.insertBefore(style, document.head.firstChild);
          });
        }

        if (window.MutationObserver) {
          var observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
              if (mutation.type === 'attributes' && mutation.attributeName === 'style') {
                var target = mutation.target;
                var computedStyle = window.getComputedStyle(target);
                var filter = computedStyle.filter || computedStyle.webkitFilter;
                
                if (filter && filter !== 'none' && filter.indexOf('invert') !== -1) {
                  target.style.setProperty('-webkit-filter', 'none', 'important');
                  target.style.setProperty('filter', 'none', 'important');
                }
              }
            });
          });
          
          observer.observe(document.documentElement, { attributes: true, attributeFilter: ['style'] });
          document.addEventListener('DOMContentLoaded', function() {
            observer.observe(document.body, { attributes: true, attributeFilter: ['style'] });
          });
        }
      } catch (e) {}
    })();

    // 快速设置标题
    (function initTitle() {
      try {
        var cachedWebInfo = localStorage.getItem('webInfo');
        if (cachedWebInfo) {
          var webInfoData = JSON.parse(cachedWebInfo);
          if (webInfoData && webInfoData.data) {
            var tabTitle = webInfoData.data.webTitle || webInfoData.data.webName;
            if (tabTitle) {
              document.title = tabTitle;
              window.OriginTitile = tabTitle;
            }
          }
        }
      } catch (e) {}
    })();

    // 自动检测暗色模式
    (function initDarkMode() {
      try {
        var userTheme = localStorage.getItem('theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (userTheme === 'dark' || (userTheme !== 'light' && prefersDark)) {
          document.documentElement.classList.add('dark-mode');
          document.body.classList.add('dark-mode');

          var root = document.documentElement;
          var darkVars = {
            '--background': '#272727',
            '--fontColor': 'white',
            '--borderColor': '#4F4F4F',
            '--borderHoverColor': 'black',
            '--articleFontColor': '#E4E4E4',
            '--articleGreyFontColor': '#D4D4D4',
            '--commentContent': '#383838',
            '--favoriteBg': '#1e1e1e',
            '--whiteMask': 'rgba(56, 56, 56, 0.3)',
            '--maxWhiteMask': 'rgba(56, 56, 56, 0.5)',
            '--maxMaxWhiteMask': 'rgba(56, 56, 56, 0.7)',
            '--miniWhiteMask': 'rgba(56, 56, 56, 0.15)',
            '--mask': 'rgba(0, 0, 0, 0.5)',
            '--miniMask': 'rgba(0, 0, 0, 0.3)',
            '--inputBackground': '#383838',
            '--secondaryText': '#B0B0B0',
            '--card-bg-rgb': '39, 39, 39'
          };

          for (var key in darkVars) {
            root.style.setProperty(key, darkVars[key]);
          }
        }
      } catch (e) {}
    })();
  </script>
  <!-- 插件配置物化注入点：后端启动/插件变更时把此占位符替换为对应物化 JS 的 script 引用 -->
  <!--PB_BOOTSTRAP-->
  <div id="app"></div>
  <!-- Vite 入口 -->
  <script type="module" src="/src/main.js"></script>
</body>

</html>
